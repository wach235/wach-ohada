<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<style>
  body {
    font-family: Arial, sans-serif;
    font-size: 11px;
    margin: 0;
    color: #222;
    line-height: 1.5;
  }
  h1 {
    font-size: 18px;
    border-bottom: 2px solid #1a1a2e;
    padding-bottom: 8px;
    color: #1a1a2e;
  }
  h2 {
    font-size: 13px;
    background: #1a1a2e;
    color: white;
    padding: 6px 12px;
    margin-top: 20px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  h3 { font-size: 12px; color: #444; }
  table {
    width: 100%;
    border-collapse: collapse;
    margin: 10px 0;
  }
  th {
    background: #f0f0f0;
    padding: 6px 10px;
    text-align: left;
    border: 1px solid #ccc;
    font-weight: bold;
  }
  td {
    padding: 5px 10px;
    border-bottom: 1px solid #e0e0e0;
  }
  tr:last-child td { font-weight: bold; background: #f9f9f9; }
  em { color: #777; font-size: 10px; }
  blockquote {
    background: #fff8e1;
    border-left: 4px solid #f9a825;
    padding: 8px 14px;
    margin: 12px 0;
    font-size: 10px;
    color: #555;
  }
  hr { border: none; border-top: 1px solid #ddd; margin: 14px 0; }
  p { margin: 6px 0; }
</style>
</head>
<body>
{{CONTENT}}
</body>
</html>
